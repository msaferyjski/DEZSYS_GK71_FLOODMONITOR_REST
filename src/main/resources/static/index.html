<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FloodMonitor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
<header>
    <h1>FloodMonitor</h1>
</header>
<main>
    <section class="panel">
        <div class="filters">
            <label>Station<select id="station"></select></label>
            <label>Von<input type="datetime-local" id="from"></label>
            <label>Bis<input type="datetime-local" id="to"></label>
            <label>Warnstufe
                <select id="warningLevel">
                    <option value="">Alle</option>
                    <option>NORMAL</option>
                    <option>WARNING</option>
                    <option>CRITICAL</option>
                    <option>UNKNOWN</option>
                </select>
            </label>
            <label>Limit<input type="number" id="limit" value="50" min="1" max="1000"></label>
            <label>Format
                <select id="format">
                    <option value="json">JSON</option>
                    <option value="xml">XML</option>
                </select>
            </label>
            <label class="check"><input type="checkbox" id="autoRefresh" checked> Auto-Refresh (10 s)</label>
            <button id="apply">Anwenden</button>
        </div>
        <div id="state" class="state"></div>
    </section>

    <section class="panel">
        <h2>Aktuellster Messwert</h2>
        <div id="latest" class="cards"></div>
    </section>

    <section class="panel">
        <h2>Historische Messwerte</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Station</th>
                    <th>Zeitpunkt</th>
                    <th>Wasserstand (cm)</th>
                    <th>Durchfluss (m³/s)</th>
                    <th>Niederschlag (mm/h)</th>
                    <th>Akku (%)</th>
                    <th>Status</th>
                    <th>Warnstufe</th>
                </tr>
                </thead>
                <tbody id="history"></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
