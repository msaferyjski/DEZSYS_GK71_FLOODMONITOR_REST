server.address=127.0.0.1
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

polling.interval=${POLL_INTERVAL_MS:10000}
station.ports=${STATION_PORTS:ST-001:8101,ST-002:8102,ST-003:8103,ST-004:8104,ST-005:8105}
station.key=${STATION_KEY:}
api.viewer-key=${VIEWER_KEY:}
api.admin-key=${ADMIN_KEY:}

measurement.max-age-seconds=300
api.limit.default=100
api.limit.max=1000
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.version=OPENAPI_3_0
